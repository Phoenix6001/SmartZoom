name: Bug report
description: Something zoomed wrongly, or did not zoom at all
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The diagnostic report answers most of these questions on its own: it says which application each
        press resolved to, which strategy ran, and why nothing was zoomed. Nothing in it leaves your machine
        until you paste it here.

  - type: input
    id: application
    attributes:
      label: Which application
      placeholder: Brave 1.7, Acrobat Reader 26, Excel 365 …
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What you pointed at, and what happened
      description: What did you expect instead?
      placeholder: |
        Pointed at a paragraph halfway down a Wikipedia article and pressed the side button.
        The page zoomed but jumped to the top, so the paragraph was off screen.
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: >
        Double-click the tray icon (or right-click it and choose **Diagnostic report…**), open the
        **Diagnostics** tab, press **Copy**, and paste here. Read it first: it names the applications
        SmartZoom has seen.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log lines (optional)
      description: >
        If you already have the log open, the `Trigger at …` line for that press and anything after it.
        The log is at `%LOCALAPPDATA%\SmartZoom\logs\smartzoom-<date>.log`, or right-click the tray icon
        and choose **Open log folder**. Ticking **Include recent log lines** before copying the report
        does the same thing.
      render: text

  - type: input
    id: version
    attributes:
      label: SmartZoom version or commit
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display scaling and resolution
      description: Settings → System → Display. Several zoom constants were measured at 200%, so this matters.
      placeholder: 3840x2160 at 200%
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Vendor mouse software, multiple monitors at different scaling, an elevated window …
